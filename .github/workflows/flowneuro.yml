name: FlowNeuro fork - APK and source ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt"
      - "app/src/main/kotlin/com/metrolist/music/ui/screens/settings/**"
      - "app/src/main/kotlin/com/metrolist/music/flowneuro/**"
      - "app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt"
      - "app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt"
      - ".github/workflows/flowneuro.yml"

permissions:
  contents: read

jobs:
  build-flowneuro:
    name: Build FlowNeuro FOSS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.flowneuro
          METROLIST_APP_NAME: Metrolist FlowNeuro
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} artifacts/Metrolist-FlowNeuro-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-flowneuro-apk
          path: artifacts/Metrolist-FlowNeuro-debug.apk
          if-no-files-found: error

      - name: Create source ZIP
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/metrolist-flowneuro-source-${GITHUB_SHA::7}.zip HEAD

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-flowneuro-source
          path: artifacts/metrolist-flowneuro-source-*.zip
          if-no-files-found: error
